# cargo-about: the third-party notices shipped in a release archive.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
# Four Zed crates leave the license field empty and carry their license as
# a symlink to the repository's file instead; the checksums pin those files.

[grammars.clarify]
license = "GPL-3.0-or-later"
[[grammars.clarify.files]]
path = "LICENSE-GPL"
checksum = "0aa0322ea494da441088e4d9144c6720bf99d9e2e1eefcd29d1f58b19b5c4246"

