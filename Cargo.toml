[package]
name = "zec"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
default = []

# The Zed dependency graph makes full debug info cost tens of gigabytes of
# PDB/DWARF per test binary; line tables keep backtraces precise at a small
# fraction of that.
[profile.dev]
debug = "line-tables-only"

[[bin]]
name = "zec"
path = "src/main.rs"

