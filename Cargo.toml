[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs", "signal", "term"] }
portable-pty = "0.9"
signal-hook = "0.3.18"

[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "dff1fd868c750dbbae179fcd5c43ce987e4e0528" }
