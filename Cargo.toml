[package]
name = "zec"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
default-run = "zec"
autobins = false

[features]
default = []
alpha-1-linux = []

[[bin]]
name = "zec"
path = "src/main.rs"

[[bin]]
name = "zec-remote-server"
path = "src/bin/zec_remote_server.rs"

[[bin]]
name = "zec_acp_fixture"
path = "src/bin/zec_acp_fixture.rs"

[[bin]]
name = "alpha_1_fixture"
path = "src/bin/alpha_1_fixture.rs"
required-features = ["alpha-1-linux"]

[[bin]]
name = "alpha_1_acceptance"
path = "src/bin/alpha_1_acceptance.rs"
required-features = ["alpha-1-linux"]

[[bin]]
name = "alpha_1_bench"
path = "src/bin/alpha_1_bench.rs"
required-features = ["alpha-1-linux"]

[[bin]]
name = "alpha_2_fixture_lsp"
path = "src/bin/alpha_2_fixture_lsp.rs"

[[bin]]
name = "alpha_2_acceptance"
path = "src/bin/alpha_2_acceptance.rs"

[[bin]]
name = "alpha_2_bench"
path = "src/bin/alpha_2_bench.rs"

[[bin]]
name = "alpha_3_acceptance"
path = "src/bin/alpha_3_acceptance.rs"
required-features = ["alpha-1-linux"]

[[bin]]
name = "alpha_3_bench"
path = "src/bin/alpha_3_bench.rs"
required-features = ["alpha-1-linux"]

[dependencies]
acp_thread = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
agent = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
agent_settings = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
agent_servers = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
anyhow = "1"
askpass = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
async-channel = "2.5"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-trait = "0.1"
assets = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
base64 = "0.22"
crossterm = { version = "0.29", features = ["osc52"] }
cloud_api_types = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
channel = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
codestral = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
collections = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
copilot = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
dap = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
dap_adapters = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
debug_adapter_extension = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
client = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
clap = { version = "4", features = ["derive"] }
crashes = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
db = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
editor = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
edit_prediction = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
edit_prediction_types = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
extension = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
extension_host = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
futures = "0.3"
zed_fs = { package = "fs", git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
gpui_tokio = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
http_client = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
image = "0.25.10"
icons = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
language = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
language_extension = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
language_model = { git = "https://github.com/zed-industries/zed.git", rev = "cef06d351bec10d0fb6176018ce8624e97baeb40" }
