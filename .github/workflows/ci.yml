name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TERM: xterm-256color

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            g++ \
            gcc \
            git \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            make
          sudo apt-get clean

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc --version --verbose
          cargo --version
          rustfmt --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-debug
          cache-on-failure: true

      - name: Verify lockfile and formatting
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo fmt --all -- --check

      - name: Build zec
        timeout-minutes: 60
        run: cargo build --locked --bin zec

      - name: Run unit tests
        timeout-minutes: 30
        run: cargo test --locked --bin zec -- --test-threads=1

      - name: Run PTY tests
        timeout-minutes: 30
        run: cargo test --locked --test e2e -- --test-threads=1

      - name: Run headless smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          smoke_output="$(./target/debug/zec --smoke)"
          printf '%s\n' "$smoke_output"
          grep -Fq 'initial: ""' <<< "$smoke_output"
          grep -Fq 'after insert: "hello from zec"' <<< "$smoke_output"
          grep -Fq 'after undo: ""' <<< "$smoke_output"

  windows:
    name: Windows native
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc --version --verbose
          cargo --version
          rustfmt --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-debug
          cache-on-failure: true

      - name: Verify lockfile and formatting
        timeout-minutes: 15
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --no-deps | Out-Null
          cargo fmt --all -- --check

      - name: Build zec
        timeout-minutes: 60
        run: cargo build --locked --bin zec

      - name: Run unit tests
        timeout-minutes: 45
        run: cargo test --locked --bin zec -- --test-threads=1

      - name: Run ConPTY tests
        timeout-minutes: 45
        run: cargo test --locked --test e2e -- --test-threads=1

      - name: Run Windows GPUI smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $output = @(& .\target\debug\zec.exe --smoke)
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "zec --smoke exited with $LASTEXITCODE"
          }
          $expected = @(
            'initial: ""'
            'after insert: "hello from zec"'
            'after undo: ""'
          )
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $output
          if ($difference) {
            throw "unexpected smoke output: $($output -join ' | ')"
          }
