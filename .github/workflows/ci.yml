name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  linux:
    name: Linux graduation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TERM: xterm-256color

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record disk baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "CI_DISK_BASELINE_KIB=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $3 }')" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            elfutils \
            g++ \
            gcc \
            gettext-base \
            gdb \
            git \
            jq \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            make \
            musl-dev \
            musl-tools \
            openssh-server \
            pipewire \
            xdg-desktop-portal
          sudo install -d -m 0755 /run/sshd
          sudo apt-get clean

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc --version --verbose
          cargo --version
          rustfmt --version

      - name: Verify lockfile and formatting
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo fmt --all -- --check
          python3 script/release-manifest self-test

      - name: Build zec, remote server, and Alpha 2 gate binaries
        timeout-minutes: 60
        run: >-
          cargo build --locked
          --bin zec --bin zec-remote-server --bin alpha_2_fixture_lsp
          --bin alpha_2_acceptance --bin alpha_2_bench

      - name: Run unit and headless tests
        timeout-minutes: 30
        run: cargo test --locked --bin zec -- --test-threads=1

      - name: Run parity, PTY, and Alpha 2 integration tests
        timeout-minutes: 45
        env:
          ZEC_REQUIRE_GDB_DAP: "1"
          ZEC_REQUIRE_REMOTE_SSH: "1"
        run: >-
          cargo test --locked
          --test parity_contract --test pty_acceptance --test update_cli
          --test alpha_2_lsp --test alpha_2_settings --test alpha_2_failures
          -- --test-threads=1

      - name: Run headless smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          smoke_output="$(./target/debug/zec --smoke)"
          printf '%s\n' "$smoke_output"
          grep -Fq 'initial: ""' <<< "$smoke_output"
          grep -Fq 'after insert: "hello from zec"' <<< "$smoke_output"
          grep -Fq 'after undo: ""' <<< "$smoke_output"

      - name: Enforce CI disk budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          du -sh target "$HOME/.cargo/git" "$HOME/.cargo/registry" 2>/dev/null || true
          used_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $3 }')"
          generated_kib="$((used_kib - CI_DISK_BASELINE_KIB))"
          budget_kib="$((14 * 1024 * 1024))"
          echo "CI-generated disk: $((generated_kib / 1024)) MiB (budget: $((budget_kib / 1024)) MiB)"
          test "$generated_kib" -lt "$budget_kib"

  windows:
    name: Windows native
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc --version --verbose
          cargo --version
          rustfmt --version

      - name: Verify lockfile and formatting
        timeout-minutes: 15
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --no-deps | Out-Null
          cargo fmt --all -- --check
          python script/release-manifest self-test

      - name: Build zec and remote server
        timeout-minutes: 60
        run: cargo build --locked --bin zec --bin zec-remote-server

      - name: Run portable unit tests
        timeout-minutes: 30
        shell: pwsh
        run: |
          cargo test --locked --bin zec -- --test-threads=1
          cargo test --locked --test repository -- --test-threads=1

      - name: Run Windows GPUI smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $output = @(& .\target\debug\zec.exe --smoke)
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            throw "zec --smoke exited with $LASTEXITCODE"
          }
          $expected = @(
            'initial: ""'
            'after insert: "hello from zec"'
            'after undo: ""'
          )
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $output
          if ($difference) {
            throw "unexpected smoke output: $($output -join ' | ')"
          }
