name: E2E

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TERM: xterm-256color

jobs:
  build:
    name: Build and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record disk baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "CI_DISK_BASELINE_KIB=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $3 }')" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang cmake curl elfutils g++ gcc gdb gettext-base git jq \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libsqlite3-dev libssl-dev libstdc++-14-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev \
            lld llvm make musl-dev musl-tools openssh-server pipewire xdg-desktop-portal
          sudo install -d -m 0755 /run/sshd
          sudo apt-get clean

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc --version --verbose
          cargo --version
          rustfmt --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-release
          cache-on-failure: true

      - name: Verify lockfile, fixture oracles, scripts, and formatting
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          bash -n script/run-e2e-suites
          rustc --edition=2024 src/bin/fixture_repository.rs -o /tmp/zec-fixture-repository-verifier
          /tmp/zec-fixture-repository-verifier verify-oracles --repo .

      - name: Build release binaries
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --bin zec \
            --bin e2e_repository --bin e2e_repository_bench \
            --bin fixture_lsp --bin e2e_language --bin e2e_language_bench \
            --bin e2e_workspace --bin e2e_workspace_bench

      - name: Run release regression tests
        timeout-minutes: 60
        env:
          ZEC_REQUIRE_GDB_DAP: "1"
          ZEC_REQUIRE_REMOTE_SSH: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release \
            --bin zec -- --test-threads=1
          cargo test --locked --release \
            --test parity_contract --test e2e_tui --test update_cli \
            --test language_service --test settings_reload --test lsp_failures \
            --test workspace_layout --test project_panel \
            --test workspace_search --test workspace_sessions -- --test-threads=1

      - name: Run headless smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          smoke_output="$(./target/release/zec --smoke)"
          printf '%s\n' "$smoke_output"
          grep -Fq 'initial: ""' <<< "$smoke_output"
          grep -Fq 'after insert: "hello from zec"' <<< "$smoke_output"
          grep -Fq 'after undo: ""' <<< "$smoke_output"

      - name: Upload suite binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-binaries
          path: |
            target/release/zec
            target/release/e2e_repository
            target/release/e2e_repository_bench
            target/release/fixture_lsp
            target/release/e2e_language
            target/release/e2e_language_bench
            target/release/e2e_workspace
            target/release/e2e_workspace_bench
          if-no-files-found: error
          retention-days: 3

      - name: Enforce CI disk budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          du -sh target "$HOME/.cargo/git" "$HOME/.cargo/registry" 2>/dev/null || true
          used_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $3 }')"
          generated_kib="$((used_kib - CI_DISK_BASELINE_KIB))"
          budget_kib="$((14 * 1024 * 1024))"
          echo "CI-generated disk: $((generated_kib / 1024)) MiB (budget: $((budget_kib / 1024)) MiB)"
          test "$generated_kib" -lt "$budget_kib"

  repository:
    name: Repository acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libsqlite3-dev libssl-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
          sudo apt-get clean

      - name: Download suite binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-binaries
          path: target/release

      - name: Run repository acceptance and benchmark
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/release/*
          mkdir -p target/e2e-repository
          timeout --signal=TERM --kill-after=5s 45m \
            ./target/release/e2e_repository --zec ./target/release/zec \
            --repo . --assert --report target/e2e-repository/acceptance.json
          ./target/release/e2e_repository \
            --verify-report target/e2e-repository/acceptance.json
          timeout --signal=TERM --kill-after=5s 20m \
            ./target/release/e2e_repository_bench --zec ./target/release/zec \
            --assert --report target/e2e-repository/benchmark.json
          ./target/release/e2e_repository_bench \
            --verify-report target/e2e-repository/benchmark.json
          cd target/e2e-repository
          sha256sum acceptance.json benchmark.json > SHA256SUMS

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-repository-reports
          path: target/e2e-repository
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  language:
    name: Language acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libsqlite3-dev libssl-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
          sudo apt-get clean

      - name: Download suite binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-binaries
          path: target/release

      - name: Run language acceptance and benchmark
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/release/*
          mkdir -p target/e2e-language
          timeout --signal=TERM --kill-after=5s 45m \
            ./target/release/e2e_language --zec ./target/release/zec \
            --lsp ./target/release/fixture_lsp --assert \
            --report target/e2e-language/acceptance.json
          ./target/release/e2e_language \
            --verify-report target/e2e-language/acceptance.json
          timeout --signal=TERM --kill-after=5s 20m \
            ./target/release/e2e_language_bench --zec ./target/release/zec \
            --lsp ./target/release/fixture_lsp --assert \
            --report target/e2e-language/benchmark.json
          ./target/release/e2e_language_bench \
            --verify-report target/e2e-language/benchmark.json
          cd target/e2e-language
          sha256sum acceptance.json benchmark.json > SHA256SUMS

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-language-reports
          path: target/e2e-language
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  workspace:
    name: Workspace acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libsqlite3-dev libssl-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
          sudo apt-get clean

      - name: Download suite binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-binaries
          path: target/release

      - name: Run workspace acceptance and benchmark
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          chmod +x target/release/*
          mkdir -p target/e2e-workspace
          timeout --signal=TERM --kill-after=5s 60m \
            ./target/release/e2e_workspace --zec ./target/release/zec \
            --assert --report target/e2e-workspace/acceptance.json
          ./target/release/e2e_workspace \
            --verify-report target/e2e-workspace/acceptance.json
          timeout --signal=TERM --kill-after=5s 20m \
            ./target/release/e2e_workspace_bench --zec ./target/release/zec \
            --assert --report target/e2e-workspace/benchmark.json
          ./target/release/e2e_workspace_bench \
            --verify-report target/e2e-workspace/benchmark.json
          cd target/e2e-workspace
          sha256sum acceptance.json benchmark.json > SHA256SUMS

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-workspace-reports
          path: target/e2e-workspace
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
