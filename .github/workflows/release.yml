name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }} package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary: zec
            raw: zec-linux-x86_64
            archive: zec-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            binary: zec
            raw: zec-linux-aarch64
            archive: zec-linux-aarch64.tar.gz
          - runner: windows-2025
            os: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            binary: zec.exe
            raw: zec-windows-x86_64.exe
            archive: zec-windows-x86_64.zip
          - runner: windows-11-arm
            os: windows
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            binary: zec.exe
            raw: zec-windows-aarch64.exe
            archive: zec-windows-aarch64.zip
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
            binary: zec
            raw: zec-macos-x86_64
            archive: zec-macos-x86_64.tar.gz
          - runner: macos-15
            os: macos
            arch: aarch64
            rust_target: aarch64-apple-darwin
            binary: zec
            raw: zec-macos-aarch64
            archive: zec-macos-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang cmake g++ gcc gettext-base git \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libsqlite3-dev libssl-dev libva-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev lld llvm make \
            pipewire xdg-desktop-portal
          sudo apt-get clean

      - name: Install pinned Rust toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --target "$RUST_TARGET"
          rustc --version --verbose
          cargo --version

      - name: Validate tag and locked metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --format-version 1 --no-deps | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "zec"))')"
          test "$version" = "$package_version"
          python3 script/release-manifest self-test

      - name: Build release binaries
        shell: bash
        run: cargo build --locked --release --bin zec --bin zec-remote-server

      - name: Exercise release binary
        shell: bash
        env:
          BINARY: target/release/${{ matrix.binary }}
          REMOTE_BINARY: target/release/zec-remote-server${{ matrix.os == 'windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$("$BINARY" --version)" = "zec $version"
          smoke_output="$("$BINARY" --smoke)"
          grep -Fq 'initial: ""' <<< "$smoke_output"
          grep -Fq 'after insert: "hello from zec"' <<< "$smoke_output"
          grep -Fq 'after undo: ""' <<< "$smoke_output"
          test "$("$REMOTE_BINARY" version)" = "cef06d351bec10d0fb6176018ce8624e97baeb40"

      - name: Package Unix release
        if: matrix.os != 'windows'
        shell: bash
        env:
          BINARY: target/release/${{ matrix.binary }}
          RAW: ${{ matrix.raw }}
          ARCHIVE: ${{ matrix.archive }}
          REMOTE_BINARY: target/release/zec-remote-server
          REMOTE_ARCHIVE: zec-remote-server-${{ matrix.os }}-${{ matrix.arch }}.gz
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="zec-$version"
          mkdir -p "dist/$root"
          install -m 0755 "$BINARY" "dist/$RAW"
          install -m 0755 "$BINARY" "dist/$root/zec"
          gzip -n -c "$REMOTE_BINARY" > "dist/$REMOTE_ARCHIVE"
          install -m 0644 "dist/$REMOTE_ARCHIVE" "dist/$root/$REMOTE_ARCHIVE"
          install -m 0644 README.md LICENSE "dist/$root/"
          tar -C dist -czf "dist/$ARCHIVE" "$root"
          rm -r "dist/$root"
          python3 script/release-manifest metadata \
            --version "$version" --os "${{ matrix.os }}" --arch "${{ matrix.arch }}" \
            --asset "dist/$RAW" --archive "dist/$ARCHIVE" \
            --remote-server "dist/$REMOTE_ARCHIVE" \
            --output "dist/zec-release-metadata-${{ matrix.os }}-${{ matrix.arch }}.json"

      - name: Package Windows release
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          BINARY: target/release/${{ matrix.binary }}
          RAW: ${{ matrix.raw }}
          ARCHIVE: ${{ matrix.archive }}
          REMOTE_BINARY: target/release/zec-remote-server.exe
          REMOTE_ARCHIVE: zec-remote-server-${{ matrix.os }}-${{ matrix.arch }}.zip
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $root = "zec-$version"
          New-Item -ItemType Directory -Force "dist/$root" | Out-Null
          Copy-Item $env:BINARY "dist/$env:RAW"
          Copy-Item $env:BINARY "dist/$root/zec.exe"
          New-Item -ItemType Directory -Force "dist/remote-server" | Out-Null
          Copy-Item $env:REMOTE_BINARY "dist/remote-server/remote_server.exe"
          Compress-Archive -Path "dist/remote-server/remote_server.exe" -DestinationPath "dist/$env:REMOTE_ARCHIVE"
          Copy-Item "dist/$env:REMOTE_ARCHIVE" "dist/$root/$env:REMOTE_ARCHIVE"
          Remove-Item -Recurse -Force "dist/remote-server"
          Copy-Item README.md, LICENSE "dist/$root/"
          Compress-Archive -Path "dist/$root" -DestinationPath "dist/$env:ARCHIVE"
          Remove-Item -Recurse -Force "dist/$root"
          python script/release-manifest metadata `
            --version $version --os "${{ matrix.os }}" --arch "${{ matrix.arch }}" `
            --asset "dist/$env:RAW" --archive "dist/$env:ARCHIVE" `
            --remote-server "dist/$env:REMOTE_ARCHIVE" `
            --output "dist/zec-release-metadata-${{ matrix.os }}-${{ matrix.arch }}.json"

      - name: Upload target package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify, attest, and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all target packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 script/release-manifest assemble \
            --directory dist --version "$version" --repository "$GITHUB_REPOSITORY"
          python3 script/release-manifest verify \
            --directory dist --repository "$GITHUB_REPOSITORY"
          actual_targets="$(jq -r '.assets[] | "\(.os)/\(.arch)"' dist/zec-update-v1.json | sort | paste -sd, -)"
          expected_targets="linux/aarch64,linux/x86_64,macos/aarch64,macos/x86_64,windows/aarch64,windows/x86_64"
          test "$actual_targets" = "$expected_targets"
          (cd dist && sha256sum --check SHA256SUMS)
          chmod +x dist/zec-linux-x86_64
          dist/zec-linux-x86_64 update verify \
            --manifest dist/zec-update-v1.json --binary dist/zec-linux-x86_64
          mkdir publish
          while read -r _ filename; do
            cp "dist/$filename" "publish/$filename"
          done < dist/SHA256SUMS
          cp dist/SHA256SUMS publish/SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: publish/*

      - name: Create immutable-input GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" publish/*
          --verify-tag
          --title "zec $GITHUB_REF_NAME"
          --generate-notes
