name: Release

# A tag `vX.Y.Z` builds release binaries for Linux and Windows, packs each
# with the license and the generated third-party notices, and attaches
# them to a GitHub release. A pull request that touches this file or the
# release profile, and a manual dispatch, build the same binaries as
# workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: zec-x86_64-linux.tar.gz
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zec-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            g++ \
            gcc \
            git \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libsqlite3-dev \
            libssl-dev \
            libstdc++-14-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            lld \
            llvm \
            make
          sudo apt-get clean

      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustc --version --verbose
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}-release
          cache-on-failure: true

      - name: Check that the tag names the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid | sed -E 's/.*[#@]//')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build zec
        timeout-minutes: 150
        run: cargo build --locked --release --bin zec

      - name: Generate the third-party notices
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cargo about --version 2>/dev/null || cargo install cargo-about --locked --version 0.9.2 --features cli
          # No --offline: cargo-about resolves every target, so `cargo metadata`
          # must be able to fetch crates the host build never needed.
          cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html
          mkdir -p dist
          cp LICENSE THIRD_PARTY_LICENSES.html dist/

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/zec dist/
          tar -C dist -czf "${{ matrix.archive }}" zec LICENSE THIRD_PARTY_LICENSES.html
          ./target/release/zec --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\release\zec.exe dist\
          Compress-Archive -Path dist\zec.exe, dist\LICENSE, dist\THIRD_PARTY_LICENSES.html -DestinationPath "${{ matrix.archive }}"
          & .\target\release\zec.exe --version
          if ($LASTEXITCODE -ne 0) { throw "zec --version exited with $LASTEXITCODE" }

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- *
